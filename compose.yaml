services:
  superai:
    build: .
    image: ${SUPERAI_IMAGE:-superai:local}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /data
      SUPERAI_UPDATES: ${SUPERAI_UPDATES:-}
      MIOT_LOGIN_DIAGNOSTICS: ${MIOT_LOGIN_DIAGNOSTICS:-false}
      LX_DNS_OVER_HTTPS: ${LX_DNS_OVER_HTTPS:-auto}
      SPEAKER_RELAY_HOST: ${SPEAKER_RELAY_HOST:-}
      SPEAKER_RELAY_PORT: ${SPEAKER_RELAY_PORT:-8788}
      SPEAKER_RELAY_BASE_URL: ${SPEAKER_RELAY_BASE_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      MASTER_KEY: ${MASTER_KEY:-}
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:${PUBLISH_PORT:-8787}:8787"
      # Enable only with SPEAKER_RELAY_HOST, SPEAKER_RELAY_BASE_URL, and a
      # LAN-only host address. Never publish this port to the public Internet.
      # - "192.168.1.10:8788:8788"
    volumes:
      - speaker-data:/data

volumes:
  speaker-data:
