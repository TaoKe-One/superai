name: Publish preview

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "docs/previews/**"
      - "public/superai-icon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Assemble the read-only preview
        run: |
          set -euo pipefail
          screenshots=(docs/previews/{player,devices,assistant}{,-mobile}.png)
          revision=$(sha256sum demo/index.html demo/style.css public/superai-icon.png "${screenshots[@]}" | sha256sum | cut -c1-12)
          preview_dir="_site/view/$revision"
          mkdir -p "$preview_dir/previews" _site/previews

          cp demo/index.html demo/style.css public/superai-icon.png "$preview_dir/"
          cp "${screenshots[@]}" "$preview_dir/previews/"
          sed -E "s#\./(style\.css|superai-icon\.png|previews/)#./view/$revision/\1#g" demo/index.html > _site/index.html

          # Keep the asset URLs in previously cached versions of the root page readable.
          cp demo/style.css public/superai-icon.png _site/
          cp "${screenshots[@]}" _site/previews/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
