<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="超级爱播放器、音箱设备和 AI 助手的实际界面截图"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; img-src 'self'; form-action 'none'; base-uri 'none'"
    />
    <title>超级爱 · 界面预览</title>
    <link rel="icon" href="./superai-icon.png" type="image/png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>超级爱界面预览</h1>
      <a class="repository" href="https://github.com/TaoKe-One/superai"
        >GitHub ↗</a
      >
      <p>截图来自实际应用，使用示例数据。可切换三个视图。</p>
      <nav aria-label="预览视图">
        <a href="#player">播放器</a>
        <a href="#devices">音箱设备</a>
        <a href="#assistant">AI 助手</a>
      </nav>
    </header>

    <main>
      <section id="player" aria-label="播放器预览" tabindex="-1">
        <picture>
          <source
            media="(max-width: 600px)"
            srcset="./previews/player-mobile.png"
          />
          <img
            src="./previews/player.png"
            alt="超级爱实际播放器界面，展示示例音乐库和正在播放的歌曲"
          />
        </picture>
      </section>
      <section id="devices" aria-label="音箱设备预览" tabindex="-1">
        <picture>
          <source
            media="(max-width: 600px)"
            srcset="./previews/devices-mobile.png"
          />
          <img
            src="./previews/devices.png"
            alt="超级爱实际音箱设备界面，展示示例音箱和语音处理记录"
            loading="lazy"
          />
        </picture>
      </section>
      <section id="assistant" aria-label="AI 助手预览" tabindex="-1">
        <picture>
          <source
            media="(max-width: 600px)"
            srcset="./previews/assistant-mobile.png"
          />
          <img
            src="./previews/assistant.png"
            alt="超级爱实际 AI 助手界面，展示一轮示例问答"
            loading="lazy"
          />
        </picture>
      </section>
    </main>
  </body>
</html>
